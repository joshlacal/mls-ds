# docker-compose.federation.yml — Two federated MLS-DS instances for local testing
#
# Usage:
#   docker compose -f docker-compose.federation.yml up -d
#   curl http://localhost:3001/xrpc/blue.catbird.mls.ds.healthCheck
#   curl http://localhost:3002/xrpc/blue.catbird.mls.ds.healthCheck
#   docker compose -f docker-compose.federation.yml down -v

services:
  # ── Shared infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: catbird
      POSTGRES_PASSWORD: catbird
      POSTGRES_DB: catbird_mls_1
    volumes:
      - pgdata_fed:/var/lib/postgresql/data
      - ./federation-test/init-federation-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbird -d catbird_mls_1"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-bookworm
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MLS-DS Instance 1 ────────────────────────────────────────────────
  mls-ds-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://catbird:catbird@postgres:5432/catbird_mls_1
      REDIS_URL: redis://redis:6379/0
      SERVER_PORT: "3001"
      SERVICE_DID: did:web:mls-ds-1
      SELF_ENDPOINT: http://mls-ds-1:3001
      DEFAULT_DS_ENDPOINT: http://mls-ds-2:3002
      FEDERATION_ENABLED: "true"
      FEDERATION_ALLOW_INSECURE_HTTP: "true"
      ENFORCE_LXM: "false"
      ENFORCE_JTI: "false"
      ALLOW_UNSAFE_AUTH: "true"
      APP_ENV: development
      RUST_LOG: info,catbird_server::federation=debug,catbird_server::handlers::ds=debug
      TICKET_SECRET: test-ticket-secret-1
      # SIGNING_KEY_PEM: <set via .env or volume mount>
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MLS-DS Instance 2 ────────────────────────────────────────────────
  mls-ds-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://catbird:catbird@postgres:5432/catbird_mls_2
      REDIS_URL: redis://redis:6379/1
      SERVER_PORT: "3002"
      SERVICE_DID: did:web:mls-ds-2
      SELF_ENDPOINT: http://mls-ds-2:3002
      DEFAULT_DS_ENDPOINT: http://mls-ds-1:3001
      FEDERATION_ENABLED: "true"
      FEDERATION_ALLOW_INSECURE_HTTP: "true"
      ENFORCE_LXM: "false"
      ENFORCE_JTI: "false"
      ALLOW_UNSAFE_AUTH: "true"
      APP_ENV: development
      RUST_LOG: info,catbird_server::federation=debug,catbird_server::handlers::ds=debug
      TICKET_SECRET: test-ticket-secret-2
      # SIGNING_KEY_PEM: <set via .env or volume mount>
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata_fed:
