# Two-node federation stack for clean-chat testing (Colima / Docker Compose).
#
# Canonical Compose topology for DS1 and DS2 federated cluster.
# References: docs/superpowers/plans/2026-08-24-clean-chat-federation-container.md

services:
  ds1-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: catbird
      POSTGRES_PASSWORD: catbird
      POSTGRES_DB: catbird
    ports:
      - "${DS1_DB_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbird -d catbird"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ds1_pgdata:/var/lib/postgresql/data

  ds1-redis:
    image: redis:7-bookworm
    ports:
      - "${DS1_REDIS_PORT:-0}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ds1:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: federation-test
      additional_contexts:
        catbird-atproto: ../../catbird-atproto
    depends_on:
      ds1-postgres:
        condition: service_healthy
      ds1-redis:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-test}"
      SERVER_PORT: "3001"
      SERVER_HOST: "0.0.0.0"
      DATABASE_URL: postgres://catbird:catbird@ds1-postgres:5432/catbird
      REDIS_URL: redis://ds1-redis:6379
      SERVICE_DID: "${DS1_SERVICE_DID:-did:web:ds1.local}"
      SELF_ENDPOINT: "${DS1_SELF_ENDPOINT:-http://ds1:3001}"
      DEFAULT_DS_ENDPOINT: "${DS2_SELF_ENDPOINT:-http://ds2:3001}"
      FEDERATION_MODE: "${FEDERATION_MODE:-allowlist}"
      FEDERATION_ENABLED: "${FEDERATION_ENABLED:-true}"
      FEDERATION_ALLOW_INSECURE_HTTP: "${FEDERATION_ALLOW_INSECURE_HTTP:-true}"
      FEDERATION_CAPABILITIES: "${FEDERATION_CAPABILITIES:-baseline,reconciliation-v1}"
      FEDERATION_ADMIN_DIDS: "${FEDERATION_ADMIN_DIDS:-did:web:ds1.local,did:web:ds2.local}"
      ENFORCE_LXM: "${ENFORCE_LXM:-true}"
      ENFORCE_JTI: "${ENFORCE_JTI:-true}"
      SIGNING_KEY_FILE: "${DS1_SIGNING_KEY_FILE:-/app/fixtures/ds1-key.pem}"
      TEST_DID_DOCUMENT_PATHS: "/app/fixtures/ds1-did.json,/app/fixtures/ds2-did.json"
      CHAT_OPERATION_CLAIM_ACTIVATION_APPROVED: "${CHAT_OPERATION_CLAIM_ACTIVATION_APPROVED:-handlers-and-legacy-apis-sealed}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://ds1-blobstore:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-catbird-minio-access}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-catbird-minio-secret-key-32-bytes!}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${DS1_PORT:-0}:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health/ready >/dev/null && curl -sf http://localhost:3001/xrpc/blue.catbird.mlsDS.healthCheck >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s

  ds2-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: catbird
      POSTGRES_PASSWORD: catbird
      POSTGRES_DB: catbird
    ports:
      - "${DS2_DB_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbird -d catbird"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ds2_pgdata:/var/lib/postgresql/data

  ds2-redis:
    image: redis:7-bookworm
    ports:
      - "${DS2_REDIS_PORT:-0}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ds2:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: federation-test
      additional_contexts:
        catbird-atproto: ../../catbird-atproto
    depends_on:
      ds2-postgres:
        condition: service_healthy
      ds2-redis:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-test}"
      SERVER_PORT: "3001"
      SERVER_HOST: "0.0.0.0"
      DATABASE_URL: postgres://catbird:catbird@ds2-postgres:5432/catbird
      REDIS_URL: redis://ds2-redis:6379
      SERVICE_DID: "${DS2_SERVICE_DID:-did:web:ds2.local}"
      SELF_ENDPOINT: "${DS2_SELF_ENDPOINT:-http://ds2:3001}"
      DEFAULT_DS_ENDPOINT: "${DS1_SELF_ENDPOINT:-http://ds1:3001}"
      FEDERATION_MODE: "${FEDERATION_MODE:-allowlist}"
      FEDERATION_ENABLED: "${FEDERATION_ENABLED:-true}"
      FEDERATION_ALLOW_INSECURE_HTTP: "${FEDERATION_ALLOW_INSECURE_HTTP:-true}"
      FEDERATION_CAPABILITIES: "${FEDERATION_CAPABILITIES:-baseline,reconciliation-v1}"
      FEDERATION_ADMIN_DIDS: "${FEDERATION_ADMIN_DIDS:-did:web:ds1.local,did:web:ds2.local}"
      ENFORCE_LXM: "${ENFORCE_LXM:-true}"
      ENFORCE_JTI: "${ENFORCE_JTI:-true}"
      SIGNING_KEY_FILE: "${DS2_SIGNING_KEY_FILE:-/app/fixtures/ds2-key.pem}"
      TEST_DID_DOCUMENT_PATHS: "/app/fixtures/ds1-did.json,/app/fixtures/ds2-did.json"
      CHAT_OPERATION_CLAIM_ACTIVATION_APPROVED: "${CHAT_OPERATION_CLAIM_ACTIVATION_APPROVED:-handlers-and-legacy-apis-sealed}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://ds2-blobstore:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-catbird-minio-access}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-catbird-minio-secret-key-32-bytes!}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${DS2_PORT:-0}:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health/ready >/dev/null && curl -sf http://localhost:3001/xrpc/blue.catbird.mlsDS.healthCheck >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s

volumes:
  ds1_pgdata:
  ds2_pgdata:
