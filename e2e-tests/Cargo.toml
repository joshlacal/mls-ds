[package]
name = "mls-e2e-tests"
version = "0.1.0"
edition = "2021"

[features]
default = []
local-runtime-fixture = ["dep:axum", "dep:url"]
# Labyrinth encrypted history backup through the live orchestrator
# (`tests/labyrinth_live_orchestrator.rs`); needs the `labyrinth` crate at
# the path catbird-mls names (`../../labyrinth-wire` from catbird-mls).
labyrinth = ["catbird_mls/labyrinth"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
anyhow = "1"
async-trait = "0.1"
catbird_mls = { path = "../../catbird-mls", features = ["e2e-aad"] }
catbird-atproto = { path = "../../catbird-atproto" }
hex = "0.4"
ulid = "1.2.1"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
serde_ipld_dagcbor = "0.6"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
multibase = "0.9"

axum = { version = "0.8", optional = true }
url = { version = "2", optional = true }

# Only for tests that include catbird-mls/tests/mock_{storage,credentials}.rs
# (app-metadata storage beside a real orchestrator); pinned exactly as catbird-mls.
[dev-dependencies]
openmls_traits = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0-rc.3", git = "https://github.com/openmls/openmls", rev = "e7c2437e845eb767d2cdd22eece2b3c5d484e4e7", features = ["draft-ietf-mls-pq-ciphersuites"] }

[[example]]
name = "client_runtime_gateway"
required-features = ["local-runtime-fixture"]
