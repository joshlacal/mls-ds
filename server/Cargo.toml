[package]
name = "catbird-server"
version = "0.1.0"
edition = "2021"
authors = ["Catbird Team"]
description = "Private MLS group chat server with ATProto identity"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
k256 = { version = "0.13", features = ["ecdsa"] }
# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
urlencoding = "2"

# Realtime / SSE
async-trait = "0.1"
ulid = "1.1"
http = "1.0"
serde_bytes = "0.11"

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate"] }

# MLS
openmls = { version = "=0.9.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b" }
openmls_traits = { version = "=0.6.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b", features = ["draft-ietf-mls-pq-ciphersuites", "clonable"] }
openmls_rust_crypto = { version = "=0.6.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "=0.4.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0-rc.3", default-features = false, git = "https://github.com/joshlacal/openmls", rev = "3ea192fc346663fba5db63aa8c90ccc3ae49f12b", features = ["draft-ietf-mls-pq-ciphersuites"] }
libcrux-kem = "=0.0.9"
x25519-dalek = "=2.0.1"

# Crypto
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
base64 = "0.21"
multibase = "0.9"

# Auth/JWT
jsonwebtoken = "9"

# Jacquard (ATProto types)
catbird-atproto = { path = "../../catbird-atproto" }
jacquard-common = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-axum = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-derive = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-lexicon = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
serde_html_form = "0.4"
miette = "7"
rustversion = "1"
bytes = "1"

# HTTP client (for DID resolution)
reqwest = { version = "0.12", features = ["json"] }

# S3-compatible blob storage (SeaweedFS)
# Disable default features to avoid pulling legacy rustls 0.21 (vulnerable
# rustls-webpki 0.101.7 path). default-https-client still provides modern
# rustls 0.23 + aws-lc-rs via aws-smithy-runtime's default-https-client feature.
# `rustls` is also explicitly enabled so a TLS provider is guaranteed to be
# selected at runtime when default features are off (per gemini PR #13 review:
# in some AWS SDK v1 configurations, default-https-client alone fails to wire
# a connector and S3 init crashes only on first call). Defense-in-depth.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso", "rustls"] }

# Caching and rate limiting
moka = { version = "0.12", features = ["future", "sync"] }
governor = "0.6"

# Async primitives
parking_lot = "0.12"

# Actor system
ractor = "0.12"
dashmap = "6.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
once_cell = "1.19"
ipnet = "2.10"

# Push notifications
a2 = "0.10"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
prometheus = "0.14"

# WebSocket support for subscriptions
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde_ipld_dagcbor = "0.6"
hex = "0.4.3"
tls_codec = "=0.5.0"
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3"
tower-util = { package = "tower", version = "0.5", features = ["util"] }
 

[[bin]]
name = "catbird-server"
path = "src/main.rs"
required-features = ["server-bin"]

[[bin]]
name = "deadletter_recover"
path = "src/bin/deadletter_recover.rs"
required-features = ["server-bin"]

[[bin]]
name = "federation_fixture"
path = "src/bin/federation_fixture.rs"
required-features = ["test-support"]

[[example]]
name = "seal_mls_chat_crypto_wire_v09"
path = "examples/seal_mls_chat_crypto_wire_v09.rs"

[[test]]
name = "chat_protocol_production_cfg"
path = "tests/chat_protocol_production_cfg.rs"
required-features = ["chat-protocol-production-proof"]

[[test]]
name = "chat_protocol_create_conversation_regression"
path = "tests/chat_protocol_create_conversation_regression.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_blobs"
path = "tests/chat_protocol_blobs.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_device_handlers"
path = "tests/chat_protocol_device_handlers.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_g7_entitlement"
path = "tests/chat_protocol_g7_entitlement.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_inventory"
path = "tests/chat_protocol_inventory.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_s3_lifecycle"
path = "tests/chat_protocol_s3_lifecycle.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_ticket"
path = "tests/chat_protocol_ticket.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_wire"
path = "tests/chat_protocol_wire.rs"
required-features = ["test-support"]

[[test]]
name = "federation_hostile_peers"
path = "tests/federation_hostile_peers.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_create_conversation_handlers"
path = "tests/chat_protocol_create_conversation_handlers.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_federation_routing"
path = "tests/chat_protocol_federation_routing.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_federation_router"
path = "tests/chat_protocol_federation_router.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_federation_outbox_retry"
path = "tests/chat_protocol_federation_outbox_retry.rs"
required-features = ["test-support"]

[[test]]
name = "chat_protocol_remote_prefix_bootstrap"
path = "tests/chat_protocol_remote_prefix_bootstrap.rs"
required-features = ["test-support"]

[[test]]
name = "federation_fixture_cli"
path = "tests/federation_fixture_cli.rs"
required-features = ["test-support"]

[features]
default = ["namespace-bluecatbird", "server-bin"]
namespace-bluecatbird = []
server-bin = []
chat-protocol-production-proof = []
subscription-production-proof = []
test-support = []
