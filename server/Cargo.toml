[package]
name = "catbird-server"
version = "0.1.0"
edition = "2021"
authors = ["Catbird Team"]
description = "Private MLS group chat server with ATProto identity"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
k256 = { version = "0.13", features = ["ecdsa"] }
# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["trace", "cors"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
urlencoding = "2"

# Realtime / SSE
async-trait = "0.1"
ulid = "1.1"
http = "1.0"
serde_bytes = "0.11"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "macros", "uuid", "chrono", "migrate"] }

# MLS
openmls = { version = "=0.8.1", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
openmls_traits = { version = "=0.5.0", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
openmls_basic_credential = { version = "=0.5.0", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
openmls_rust_crypto = { version = "=0.5.1", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
openmls_libcrux_crypto = { version = "=0.3.1", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
openmls_memory_storage = { version = "=0.5.0", git = "https://github.com/joshlacal/openmls", rev = "105027de96cad9835c81272651a93eeaf253b054" }
libcrux-kem = "=0.0.7"
x25519-dalek = "=2.0.1"

# Crypto
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
zeroize = "1"
base64 = "0.21"
multibase = "0.9"

# Auth/JWT
jsonwebtoken = "9"

# Jacquard (ATProto types)
catbird-atproto = { path = "../../catbird-atproto" }
jacquard-common = "=0.12.1"
jacquard-axum = "=0.12.1"
jacquard-derive = "=0.12.1"
jacquard-lexicon = "=0.12.1"
serde_html_form = "0.4"
miette = "7"
rustversion = "1"
bytes = "1"

# HTTP client (for DID resolution)
reqwest = { version = "0.12", features = ["json"] }

# S3-compatible blob storage (SeaweedFS)
# Disable default features to avoid pulling legacy rustls 0.21 (vulnerable
# rustls-webpki 0.101.7 path). default-https-client still provides modern
# rustls 0.23 + aws-lc-rs via aws-smithy-runtime's default-https-client feature.
# `rustls` is also explicitly enabled so a TLS provider is guaranteed to be
# selected at runtime when default features are off (per gemini PR #13 review:
# in some AWS SDK v1 configurations, default-https-client alone fails to wire
# a connector and S3 init crashes only on first call). Defense-in-depth.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio", "rustls"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso", "rustls"] }

# Caching and rate limiting
moka = { version = "0.12", features = ["future", "sync"] }
governor = "0.6"

# Async primitives
parking_lot = "0.12"

# Actor system
ractor = "0.12"
dashmap = "6.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
once_cell = "1.19"
ipnet = "2.10"

# Push notifications
a2 = "0.10"

# Metrics
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
prometheus = "0.14"

# WebSocket support for subscriptions
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde_ipld_dagcbor = "0.6"
hex = "0.4.3"
tls_codec = "=0.4.2"
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3"
tower-util = { package = "tower", version = "0.5", features = ["util"] }
 

[[bin]]
name = "catbird-server"
path = "src/main.rs"
required-features = ["server-bin"]

[[bin]]
name = "deadletter_recover"
path = "src/bin/deadletter_recover.rs"
required-features = ["server-bin"]

[[test]]
name = "chat_protocol_production_cfg"
path = "tests/chat_protocol_production_cfg.rs"
required-features = ["chat-protocol-production-proof"]

[[test]]
name = "chat_protocol_create_conversation_regression"
path = "tests/chat_protocol_create_conversation_regression.rs"

[features]
default = ["namespace-bluecatbird", "server-bin"]
namespace-bluecatbird = []
server-bin = []
chat-protocol-production-proof = []
subscription-production-proof = []
