name: MLS Server Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'server/**'
      - 'e2e-tests/**'
      - 'lexicon/**'
      - '.github/workflows/mls-deploy.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'server/**'
      - 'e2e-tests/**'
      - 'lexicon/**'
      - '.github/workflows/mls-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mls-server

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      # This shipping-feature workspace links many large Rust test binaries. Keep
      # CI artifacts compact; debug information is not part of the test gate
      # and previously exhausted the hosted runner before tests could start.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: catbird
          POSTGRES_DB: catbird
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reclaim runner disk for Rust test artifacts
        run: |
          # mls-ds does not use the preinstalled mobile, .NET, or Haskell
          # SDKs. Removing them from this ephemeral runner prevents the
          # shipping-feature Rust link from failing with ENOSPC.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Clone catbird-atproto sibling repo
        run: git clone --depth 1 https://github.com/joshlacal/catbird-atproto.git ../catbird-atproto

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      - name: Install ripgrep (required by static policy lint scripts)
        run: sudo apt-get install -y ripgrep

      - name: Run linting
        working-directory: ./server
        run: |
          cargo fmt -- --check
          # --all-targets covers tests/benches/examples in addition to
          # --lib --bins. The narrower scope was a chore/ci-cleanup-era
          # transitional shim while pre-existing clippy warnings in test
          # code were being cleaned up; that work landed in chore/ci-cleanup.
          # Don't drop back to --lib --bins without a concrete reason; it
          # hides real lint regressions in the test suite.
          cargo clippy --lib --bins --features namespace-bluecatbird,server-bin

      - name: Install cargo-audit
        working-directory: ./server
        run: |
          cargo install cargo-audit --locked

      - name: Log redaction lint
        working-directory: ./server
        run: |
          ./scripts/log_redaction_lint.sh

      - name: Federation static policy lint
        run: |
          ./server/scripts/did_web_builder_lint.sh
          ./server/scripts/check_idempotency_schema.sh

      - name: Deployment policy lint
        run: |
          ./server/scripts/check_deploy_policy.sh
          ./server/scripts/check_chat_production_proof_policy.sh

      - name: Cargo audit
        # Cargo.lock lives at the workspace root, not in ./server. Run from
        # repo root so cargo-audit can find it. Pre-existing bug — fixed
        # alongside SERVER A/B/C CI green-up.
        #
        # Ignored advisories (transitive deps, no direct fix path).
        # See PR opening this audit fix for the full before/after table.
        #
        # ── Group 1: awaits sqlx 0.8 upgrade (tracked separately) ────────
        # sqlx 0.7.4 transitively pulls vulnerable rustls 0.21 / rustls-webpki
        # 0.101.7 / rustls-pemfile 1.0.4 / paste. Upgrade to sqlx 0.8 is a
        # dedicated PR (breaking changes: GAT trait redesign, Encode->Result,
        # Migration struct fields, integer overflow behavior).
        # - RUSTSEC-2024-0363: sqlx Binary Protocol Misinterpretation
        # - RUSTSEC-2024-0436: paste unmaintained (via sqlx-macros)
        #
        # ── Group 2: awaits a2 release dropping rustls 0.22 ──────────────
        # a2 0.10.0 (latest) pulls rustls 0.22.4 / rustls-webpki 0.102.8 /
        # rustls-pemfile 2.2.0. RUSTSEC IDs below also overlap with sqlx
        # path; cargo-audit dedupes by ID so one ignore covers both sources.
        # - RUSTSEC-2025-0134: rustls-pemfile unmaintained (a2 + sqlx paths)
        # - RUSTSEC-2026-0049: rustls-webpki CRL Distribution Point logic
        # - RUSTSEC-2026-0098: rustls-webpki URI name constraints
        # - RUSTSEC-2026-0099: rustls-webpki wildcard name constraints
        # - RUSTSEC-2026-0104: rustls-webpki CRL parsing panic
        #
        # ── Group 3: awaits openmls_libcrux_crypto 0.3.x patch ───────────
        # openmls_libcrux_crypto 0.3.1 (latest) internally pins old libcrux
        # subcrate versions. Required for post-quantum XWing cipher suite
        # support; cannot be removed. catbird-mls peer repo has the same
        # pinning so no version-skew coordination required.
        # - RUSTSEC-2026-0073: libcrux-poly1305 panic (=0.0.4 hard pin)
        # - RUSTSEC-2026-0075: libcrux-ed25519 all-zero key gen on RNG fail
        # - RUSTSEC-2026-0124: libcrux-chacha20poly1305 overlong ciphertext
        #   panic (=0.0.6/0.0.7 hard pins via libcrux-aead/hpke-rs-libcrux)
        # - RUSTSEC-2026-0173: proc-macro-error2 unmaintained via
        #   hax-lib-macros/libcrux; no direct mls-ds dependency
        #
        # ── Group 4: pure unmaintained / no fix path ─────────────────────
        # - RUSTSEC-2023-0071: rsa Marvin Attack — "No fixed upgrade is
        #   available!" per RustSec. Pulled by jose-jwk via jacquard.
        # - RUSTSEC-2023-0089: atomic-polyfill unmaintained (heapless/postcard
        #   transitive via jacquard).
        # - RUSTSEC-2024-0370: proc-macro-error unmaintained (langtag/jacquard).
        # - RUSTSEC-2026-0002: lru IterMut unsound (aws-sdk-s3 internal
        #   cache). Not exercised by our usage.
        run: |
          cargo audit \
            --deny warnings \
            --ignore RUSTSEC-2024-0363 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0073 \
            --ignore RUSTSEC-2026-0075 \
            --ignore RUSTSEC-2026-0124 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2023-0089 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0207 \
            --ignore RUSTSEC-2026-0208 \
            --ignore RUSTSEC-2026-0209 \
            --ignore RUSTSEC-2026-0210 \
            --ignore RUSTSEC-2026-0211 \
            --ignore RUSTSEC-2026-0212 \
            --ignore RUSTSEC-2026-0221 \
            --ignore RUSTSEC-2026-0253

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://catbird:test_password@localhost:5432/catbird
          PGOPTIONS: "-c chat.operation_claim_activation_approved=handlers-and-legacy-apis-sealed"
        run: |
          sqlx migrate run

      - name: Run tests
        working-directory: ./server
        env:
          # Tests look for TEST_DATABASE_URL (with fallback to localhost:5433
          # which matches the dev compose stack). CI's Postgres service
          # listens on 5432, so route both DATABASE_URL and TEST_DATABASE_URL
          # to it. Without TEST_DATABASE_URL, the 9 DB-required tests in
          # db::tests / actors::tests fall back to no-creds localhost which
          # surfaces as `password authentication failed for user "runner"`.
          DATABASE_URL: postgresql://catbird:test_password@localhost:5432/catbird
          TEST_DATABASE_URL: postgresql://catbird:test_password@localhost:5432/catbird
          RUST_LOG: debug
        run: |
          cargo test --bins --features namespace-bluecatbird,server-bin

      - name: Run integration tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://catbird:test_password@localhost:5432/catbird
          TEST_DATABASE_URL: postgresql://catbird:test_password@localhost:5432/catbird
        run: |
          cargo test --test chat_protocol_signing_domain_vectors --test chat_protocol_route_inventory --features namespace-bluecatbird,server-bin

      - name: Run two-node federation lifecycle
        working-directory: ./e2e-tests
        run: cargo test --locked --test federation_two_node -- --ignored --test-threads=1

  # N33: the `#[ignore]`-gated DB regression suites (WS-1.3 sequencer-CAS
  # fences, the repaired N14 DB suites, the N32 actor single-flight race)
  # only execute under `--include-ignored` with a live Postgres. Without
  # this job they never run in CI and the regressions they pin can silently
  # return. Keep this job in the required-for-merge status checks for
  # `main`/`staging` (GitHub branch protection lists it as
  # "DB-gated regression suites (--include-ignored)").
  db-integration-tests:
    name: DB-gated regression suites (--include-ignored)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: anonymous
          POSTGRES_DB: catbird_chat_protocol_test_20260722
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Clone catbird-atproto sibling repo
        run: git clone --depth 1 https://github.com/joshlacal/catbird-atproto.git ../catbird-atproto

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: server

      - name: Create legacy migration identities
        env:
          MAINTENANCE_DATABASE_URL: postgresql://anonymous@127.0.0.1:5432/postgres
        run: |
          psql "$MAINTENANCE_DATABASE_URL" --set ON_ERROR_STOP=on --command "CREATE ROLE catbird NOLOGIN"
          psql "$MAINTENANCE_DATABASE_URL" --set ON_ERROR_STOP=on --command "CREATE DATABASE catbird OWNER anonymous"

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://127.0.0.1:5432/catbird_chat_protocol_test_20260722
          PGOPTIONS: "-c chat.operation_claim_activation_approved=handlers-and-legacy-apis-sealed"
        run: |
          sqlx migrate run

      - name: Run ignore-gated DB suites
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://127.0.0.1:5432/catbird_chat_protocol_test_20260722
          TEST_DATABASE_URL: postgresql://127.0.0.1:5432/catbird_chat_protocol_test_20260722
          CHAT_OPERATION_CLAIM_ACTIVATION_APPROVED: "handlers-and-legacy-apis-sealed"
          # N31: service identity is fail-loudly (no hardcoded fallback);
          # actor reset paths attribute system resets to this DID.
          SERVICE_DID: did:web:ci-mls.test
          RUST_LOG: info
        # --test-threads=1: db_tests serializes via a static lock; single-threaded
        # execution keeps the gate deterministic. Concurrency inside each test
        # (barriers/spawned tasks) is unaffected.
        #
        # --skip'd race_conditions cases are the documented stale-contract
        # tests (AddMembers without commit no longer advances epoch /
        # writes no commit row); they need a test-side MLS commit harness
        # and are NOT DB-gated regressions:
        #   - test_concurrent_add_members_no_duplicate_epochs
        #   - test_out_of_order_commits_prevented
        #   - test_mixed_operations_no_race_conditions
        run: |
          cargo test \
            --test sequencer_transfer_cas \
            --test db_tests \
            --test race_conditions \
            -- --include-ignored --test-threads=1 \
            --skip test_concurrent_add_members_no_duplicate_epochs \
            --skip test_out_of_order_commits_prevented \
            --skip test_mixed_operations_no_race_conditions

  build:
    name: Build and Push Docker Image
    needs: [test, db-integration-tests]
    # Skip on pull_request events: PR refs produce malformed Docker tags
    # like `mls-server:-<sha>` (empty branch + dash + sha) and the build
    # job is meant for push-to-main/staging deploys, not PR validation.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image_ref.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Clone catbird-atproto sibling repo
        run: git clone --depth 1 https://github.com/joshlacal/catbird-atproto.git ../catbird-atproto

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.14.0
        with:
          context: .
          file: ./server/Dockerfile
          build-contexts: |
            catbird-atproto=../catbird-atproto
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The current staging/production deploy target is the x86_64 Linux
          # host described in the ops runbook. Keep this release-image gate
          # native and bounded; re-enable arm64 through a native arm64 runner
          # or separate matrix job before making multi-arch images required.
          platforms: linux/amd64

      - name: Record immutable image reference
        id: image_ref
        run: echo "ref=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ steps.image_ref.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  security-scan:
    name: Security Scanning
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          version: 'v0.71.0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@f5c2471be782132e47a6e6f9c725e56730d6e9a3 # v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-mls.catbird.blue
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Verify deploy policy (staging)
        run: |
          ./server/scripts/check_deploy_policy.sh

      - name: Deploy to staging
        env:
          KUBE_CONFIG: ${{ secrets.STAGING_KUBE_CONFIG }}
          IMAGE_TAG: ${{ needs.build.outputs.image_ref }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Apply Kubernetes manifests
          kubectl set image deployment/mls-server \
            mls-server="${IMAGE_TAG}" \
            -n staging
          
          # Wait for rollout
          kubectl rollout status deployment/mls-server -n staging --timeout=5m
          
          # Verify deployment
          kubectl get pods -n staging -l app=mls-server

      - name: Run smoke tests
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          ./server/scripts/smoke-test.sh "$STAGING_URL"

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@1750b8ecfe9005e65e0e4aae75c9837b64e693af # v3.18.0
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-production:
    name: Deploy to Production
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://mls.catbird.blue
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Verify deploy policy (production)
        run: |
          ./server/scripts/check_deploy_policy.sh

      - name: Create database backup
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          ./server/scripts/backup/backup-db.sh

      - name: Deploy to production (Blue-Green)
        env:
          KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
          IMAGE_TAG: ${{ needs.build.outputs.image_ref }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Deploy to green environment
          kubectl set image deployment/mls-server-green \
            mls-server="${IMAGE_TAG}" \
            -n production
          
          # Wait for rollout
          kubectl rollout status deployment/mls-server-green -n production --timeout=10m

      - name: Run production smoke tests
        env:
          PROD_GREEN_URL: ${{ secrets.PROD_GREEN_URL }}
        run: |
          ./server/scripts/smoke-test.sh "$PROD_GREEN_URL"

      - name: Switch traffic to green
        env:
          KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl patch service mls-server -n production \
            -p '{"spec":{"selector":{"version":"green"}}}'

      - name: Monitor for 5 minutes
        run: |
          sleep 300

      - name: Scale down blue deployment
        env:
          KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          kubectl scale deployment/mls-server-blue -n production --replicas=1

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@1750b8ecfe9005e65e0e4aae75c9837b64e693af # v3.18.0
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure()
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3

      - name: Rollback to blue
        env:
          KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          
          # Switch traffic back to blue
          kubectl patch service mls-server -n production \
            -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Scale blue back up
          kubectl scale deployment/mls-server-blue -n production --replicas=3

      - name: Notify rollback
        uses: 8398a7/action-slack@1750b8ecfe9005e65e0e4aae75c9837b64e693af # v3.18.0
        with:
          status: 'warning'
          text: 'Production deployment rolled back'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
