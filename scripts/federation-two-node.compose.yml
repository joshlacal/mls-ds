services:
  ds1-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: catbird
      POSTGRES_PASSWORD: catbird
      POSTGRES_DB: ds1_catbird
    ports:
      - "${DS1_DB_PORT:-5541}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbird -d ds1_catbird"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ds1_pgdata:/var/lib/postgresql/data

  ds1-redis:
    image: redis:7-bookworm
    ports:
      - "${DS1_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ds1:
    build:
      context: ../server
      dockerfile: Dockerfile
    depends_on:
      ds1-postgres:
        condition: service_healthy
      ds1-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catbird:catbird@ds1-postgres:5432/ds1_catbird
      REDIS_URL: redis://ds1-redis:6379
      SERVER_PORT: "${DS1_PORT:-3101}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      SERVICE_DID: "${DS1_SERVICE_DID:-did:web:ds1.local}"
      SELF_ENDPOINT: "${DS1_SELF_ENDPOINT:-http://127.0.0.1:3101}"
      DEFAULT_DS_ENDPOINT: "${DS2_SELF_ENDPOINT:-http://127.0.0.1:3102}"
      FEDERATION_MODE: "${FEDERATION_MODE:-allowlist}"
      FEDERATION_ENABLED: "${FEDERATION_ENABLED:-true}"
      FEDERATION_ALLOW_INSECURE_HTTP: "${FEDERATION_ALLOW_INSECURE_HTTP:-true}"
      ENFORCE_LXM: "${ENFORCE_LXM:-false}"
      ENFORCE_JTI: "${ENFORCE_JTI:-false}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${DS1_PORT:-3101}:${DS1_PORT:-3101}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${DS1_PORT:-3101}/health/ready >/dev/null && curl -sf http://localhost:${DS1_PORT:-3101}/xrpc/blue.catbird.mls.ds.healthCheck >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  ds2-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: catbird
      POSTGRES_PASSWORD: catbird
      POSTGRES_DB: ds2_catbird
    ports:
      - "${DS2_DB_PORT:-5542}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catbird -d ds2_catbird"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ds2_pgdata:/var/lib/postgresql/data

  ds2-redis:
    image: redis:7-bookworm
    ports:
      - "${DS2_REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ds2:
    build:
      context: ../server
      dockerfile: Dockerfile
    depends_on:
      ds2-postgres:
        condition: service_healthy
      ds2-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://catbird:catbird@ds2-postgres:5432/ds2_catbird
      REDIS_URL: redis://ds2-redis:6379
      SERVER_PORT: "${DS2_PORT:-3102}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      SERVICE_DID: "${DS2_SERVICE_DID:-did:web:ds2.local}"
      SELF_ENDPOINT: "${DS2_SELF_ENDPOINT:-http://127.0.0.1:3102}"
      DEFAULT_DS_ENDPOINT: "${DS1_SELF_ENDPOINT:-http://127.0.0.1:3101}"
      FEDERATION_MODE: "${FEDERATION_MODE:-allowlist}"
      FEDERATION_ENABLED: "${FEDERATION_ENABLED:-true}"
      FEDERATION_ALLOW_INSECURE_HTTP: "${FEDERATION_ALLOW_INSECURE_HTTP:-true}"
      ENFORCE_LXM: "${ENFORCE_LXM:-false}"
      ENFORCE_JTI: "${ENFORCE_JTI:-false}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "${DS2_PORT:-3102}:${DS2_PORT:-3102}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${DS2_PORT:-3102}/health/ready >/dev/null && curl -sf http://localhost:${DS2_PORT:-3102}/xrpc/blue.catbird.mls.ds.healthCheck >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  ds1_pgdata:
  ds2_pgdata:
